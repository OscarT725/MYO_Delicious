[versions]
agp = "9.2.1"
kotlin = "2.0.21"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
appcompat = "1.6.1"
material = "1.10.0"
activityKtx = "1.8.0"
constraintlayout = "2.1.4"
supabase = "3.1.4"
ktor = "3.1.3"
serialization = "1.6.3"
googleid = "1.1.1"
credentialManager = "1.6.0"
biometric = "1.1.0"
datastore = "1.2.1"


[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
supabase-bom = {module = "io.github.jan-tennert.supabase:bom", version.ref= "supabase"}
supabase-postgrest = {module = "io.github.jan-tennert.supabase:postgrest-kt"}
supabase-auth = {module = "io.github.jan-tennert.supabase:auth-kt"}
ktor-client-android = {module = "io.ktor:ktor-client-android", version.ref = "ktor"}
kotlinx-serialization-json = {module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization"}
google-id = { module = "com.google.android.libraries.identity.googleid:googleid",version.ref = "googleid"}
credential-manager = { module = "androidx.credentials:credentials", version.ref = "credentialManager" }
credential-manager-play = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "credentialManager" }
biometric = {module = "androidx.biometric:biometric", version.ref = "biometric"}
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }



[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

